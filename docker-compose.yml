services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_RANDAILIVE_HOTEL_ID: ${VITE_RANDAILIVE_HOTEL_ID:-hotelgio}
    ports:
      - "8080:80"
    restart: unless-stopped
